# Publie une release GitHub quand un tag vX.Y.Z est poussé.
#
# L'archive jointe est celle que l'updater du plugin propose aux sites :
# sans elle, aucune mise à jour n'est proposée.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Échoue si le tag ne correspond pas à la version déclarée dans le plugin.
      - name: Build archive
        run: bin/build-release.sh "${GITHUB_REF_NAME#v}"

      # Les notes de release reprennent le message du tag annoté.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/wsform-to-externaldb-${GITHUB_REF_NAME#v}.zip" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag
